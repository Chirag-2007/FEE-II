<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <style>
        .container{
            margin: 0;
            padding: 0;
            border: 1px solid black;
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            grid-template-columns: repeat(4, 1fr);
            gap: 0px;
        }
        .box_black{
            height: 100px;
            width: 100px;
            background-color: black;
        }
        .box_white{
            height: 100px;
            width: 100px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
        <div class="box_black"></div>
        <div class="box_white"></div>
    </div>
</body>
</html>
