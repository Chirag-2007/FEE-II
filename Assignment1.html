<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 100vh;
            width: 100vw;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #container{
            height: 150px;
            width: 300px;
            background-color: cadetblue;
            padding: 56px;
            display: flex;
            justify-content: center;
            flex-direction: column; 
            border-radius: 10px;
        }
        #container input{
            border-radius: 10px;
            margin-bottom: 10px;
            padding: 5px;
            outline: none;
            background-color: lightcyan;
        }
        .input_field{
            display: flex;
            flex-direction: row;

        }
        .circle{
            border-radius: 50%;
            position: relative;
            right: 25px;
            top: 2px;
        }
        .note{
            background-color: black;
            color: white;
            border-radius: 10px;
            width: 200px;
            padding: 4px;
            margin: 2px;
            font-size: 11px;
            display: none;
            bottom: 35px;
        }
        .circle:hover{
            .note{
                position: absolute;
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="container">
            <form>
                <input type="email" placeholder="Email">
                <div class="input_field">
                    <input type="password" placeholder="Password">
                    <div class="circle">✅
                        <span class="note">Password must be minimum of 8 length</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
